name: Dry-run debug

# Manual-only: prints every currently-fetched event (from all sources,
# unfiltered by dedupe) to the workflow log, without posting to Discord or
# touching state. Useful for checking exactly what a source is or isn't
# picking up right now.
on:
  workflow_dispatch: {}

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: TEMP probe GDACS raw alert-level fields
        run: |
          python - <<'PY'
          import feedparser, requests
          r = requests.get("https://www.gdacs.org/xml/rss.xml", timeout=20,
                           headers={"User-Agent": "world-events-alerts (github.com repo bot)"})
          feed = feedparser.parse(r.content)
          print("total entries:", len(feed.entries))
          keys = sorted({k for e in feed.entries for k in e.keys() if k.startswith("gdacs")})
          print("all gdacs_* keys present:", keys)
          shown = 0
          for e in feed.entries:
              title = (e.get("title") or "")
              if not title.lower().startswith(("green", "orange")):
                  continue
              print("---")
              print("  title            :", title[:80])
              print("  alertlevel       :", repr(e.get("gdacs_alertlevel")))
              print("  episodealertlevel:", repr(e.get("gdacs_episodealertlevel")))
              print("  eventid/episodeid:", e.get("gdacs_eventid"), "/", e.get("gdacs_episodeid"))
              shown += 1
              if shown >= 12:
                  break
          PY

      - name: Dry-run all sources
        env:
          USGS_MIN_MAGNITUDE: "4.5"
          GDACS_MIN_SEVERITY: "2"
          LOG_LEVEL: "INFO"
        run: python -m alerts.run --dry-run
